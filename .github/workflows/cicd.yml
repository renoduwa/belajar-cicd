name: Production Web Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # -------------------------------------------
  # FASE 1: CONTINUOUS INTEGRATION (CI)
  # -------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install fastapi httpx pytest uvicorn

      - name: Execute Automated Tests
        run: pytest test_main.py

  # -------------------------------------------
  # FASE 2: CONTINUOUS DEPLOYMENT (CD)
  # -------------------------------------------
  deploy:
    # Kunci Keamanan: Job ini WAJIB menunggu 'test' sukses (Centang Hijau)
    needs: test 
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Remote SSH ke VPS Linux
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # IP Publik VPS
          username: ${{ secrets.SERVER_USER }} # User Linux (hindari root)
          key: ${{ secrets.SERVER_SSH_KEY }}   # Private Key Ed25519
          script: |
            cd /var/www/sistem-web
            
            # 1. Tarik kode yang sudah lolos uji CI
            git pull origin main
            
            # 2. Isolasi Environment & Update paket
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 3. Reload daemon systemd secara halus (tanpa mematikan Nginx)
            sudo systemctl restart fastapi-web.service
