name: Robot Pengecek Kode Python

on: [push] # Robot ini akan jalan setiap kali Anda melakukan 'push' (upload kode)

jobs:
  cek-error:
    runs-on: ubuntu-latest # Robot menggunakan sistem operasi Linux
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pytest
        run: pip install pytest

      - name: Jalankan Tes
        run: pytest test_app.py # Perintah untuk menjalankan file test_app.py
